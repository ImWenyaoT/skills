name: validate-skills

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-skills-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # scripts/ci.py supplies the pyproject `dev` group per run through uv,
      # pinned to the interpreter above, so nothing is installed into the job's
      # Python. ruff and ty come from that group too — one declared version each,
      # so CI and a laptop lint identically.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Run every check
        run: python scripts/ci.py

      - name: Enforce branch coverage
        if: matrix.python-version == '3.13'
        run: python scripts/ci.py --coverage

  skills-cli:
    name: skills CLI discovery
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Discover every installable skill
        run: python3 scripts/check_cli_discovery.py
