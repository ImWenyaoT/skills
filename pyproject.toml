[project]
name = "imwenyaot-skills"
version = "1.0.0"
description = "Agent Skills for research and paper work."
requires-python = ">=3.11"
dependencies = []

# The repository ships no importable package — the skills are folders, and the
# repository tooling is stdlib-only. Everything here is what the *checks* need.
[dependency-groups]
dev = [
    "coverage==7.10.7",
    "matplotlib==3.10.6",
    "pillow==12.3.0",
    "python-docx==1.2.0",
    "ruff==0.16.2",
    "ty==0.0.69",
]

[tool.ruff]
line-length = 100


[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# These two exist to show wrong code beside right code; linting the wrong half
# would be linting the point.
"skills/training-models/scripts/*_pitfalls_before_after.py" = ["ALL"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
# Everything under training-models imports torch, which is the skill's declared
# runtime and deliberately not a dependency of this repository. Type-checking it
# here would report the environment rather than the code; the tests guard the
# import and skip, and tests/verify_on_colab.ipynb runs them where torch lives.
exclude = ["skills/training-models"]
